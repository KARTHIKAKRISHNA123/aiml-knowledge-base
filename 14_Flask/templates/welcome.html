<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {{ header|safe }}
    <h1>Welcome Page</h1>
    <p>Welcome {{ name }} to my website!</p>
    <p>Your password is: {{ password }}</p>
    {% if name %}
  <h1>Hello {{ name }}!</h1>
{% else %}
  <h1>Hello, Anonymous!</h1>
{% endif %}

<ul>
    {% for friend in friends %}
        <li>{{ friend }}</li>
    {% endfor %}
</ul>
</body>
</html>
